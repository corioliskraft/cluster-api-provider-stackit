apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: StackitMachineTemplate
metadata:
  labels:
    app.kubernetes.io/name: cluster-api-provider-stackit
    app.kubernetes.io/managed-by: kustomize
  name: stackitmachinetemplate-sample
spec:
  template:
    spec:
      imageID: 22222222-2222-2222-2222-222222222222
      machineType: c2i.2
      availabilityZone: eu01-1
      rootVolume:
        sizeGiB: 50
        performanceClass: storage_premium_perf6
        deleteOnTermination: true
      network:
        id: 11111111-1111-1111-1111-111111111111
      additionalLabels:
        cluster.x-k8s.io/provider: stackit
