---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: stackitclustertemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: StackitClusterTemplate
    listKind: StackitClusterTemplateList
    plural: stackitclustertemplates
    shortNames:
    - stict
    singular: stackitclustertemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: StackitClusterTemplate is the Schema for the stackitclustertemplates
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of StackitClusterTemplate
            properties:
              template:
                description: template wraps the StackitCluster spec used to create
                  new clusters.
                properties:
                  spec:
                    description: |-
                      spec is the StackitClusterSpec that will be used to create the
                      StackitCluster.
                    properties:
                      additionalLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          additionalLabels is merged into the labels applied to cluster-wide
                          STACKIT resources such as the API server load balancer.
                        maxProperties: 64
                        type: object
                      apiServerLoadBalancer:
                        description: |-
                          apiServerLoadBalancer configures the load balancer in front of the
                          Kubernetes API server.
                        properties:
                          enabled:
                            description: enabled toggles creation of an API server
                              load balancer.
                            type: boolean
                        type: object
                      bastion:
                        description: bastion configures an optional provider-managed
                          SSH bastion host.
                        properties:
                          allowedCIDRs:
                            description: |-
                              allowedCIDRs are CIDR ranges allowed to connect to TCP/22 on the bastion.
                              Required when enabled is true.
                            items:
                              format: cidr
                              type: string
                            type: array
                          enabled:
                            description: enabled toggles creation of a provider-managed
                              SSH bastion host.
                            type: boolean
                          imageID:
                            description: |-
                              imageID is the ID of the STACKIT image to boot the bastion from.
                              Required when enabled is true.
                            pattern: ^[0-9a-fA-F-]{36}$
                            type: string
                          machineType:
                            description: |-
                              machineType selects the STACKIT machine flavor for the bastion VM.
                              Required when enabled is true.
                            pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
                            type: string
                          rootVolume:
                            description: rootVolume configures the bastion root disk.
                            properties:
                              deleteOnTermination:
                                description: |-
                                  deleteOnTermination causes the root volume to be deleted when the VM is
                                  deleted.
                                type: boolean
                              performanceClass:
                                description: performanceClass selects a STACKIT storage
                                  performance class.
                                minLength: 1
                                type: string
                              sizeGiB:
                                description: sizeGiB is the size of the root volume
                                  in GiB.
                                minimum: 0
                                type: integer
                            type: object
                          sshKeyName:
                            description: |-
                              sshKeyName is the name of an existing SSH key in the STACKIT project.
                              Required when enabled is true.
                            maxLength: 127
                            pattern: ^[A-Za-z0-9_.@-]+$
                            type: string
                        type: object
                      controlPlaneEndpoint:
                        description: |-
                          controlPlaneEndpoint allows the user to provide a pre-existing endpoint
                          when apiServerLoadBalancer.enabled is false.
                        minProperties: 1
                        properties:
                          host:
                            description: host is the hostname on which the API server
                              is serving.
                            maxLength: 512
                            minLength: 1
                            type: string
                          port:
                            description: port is the port on which the API server
                              is serving.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        type: object
                      credentialsSecretRef:
                        description: credentialsSecretRef references the Secret containing
                          STACKIT credentials.
                        properties:
                          name:
                            description: name is unique within a namespace to reference
                              a secret resource.
                            type: string
                          namespace:
                            description: namespace defines the space within which
                              the secret name must be unique.
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      network:
                        description: |-
                          network references the existing STACKIT network the cluster will use.
                          For MVP the network must already exist.
                        properties:
                          id:
                            description: id is the STACKIT network ID.
                            minLength: 1
                            pattern: ^[0-9a-fA-F-]{36}$
                            type: string
                        required:
                        - id
                        type: object
                      projectID:
                        description: projectID is the STACKIT project that owns the
                          cluster infrastructure.
                        minLength: 1
                        pattern: ^[0-9a-fA-F-]{36}$
                        type: string
                      region:
                        description: region is the STACKIT region in which infrastructure
                          is created.
                        minLength: 1
                        pattern: ^[a-z]{2}[0-9]{2}$
                        type: string
                    required:
                    - credentialsSecretRef
                    - network
                    - projectID
                    - region
                    type: object
                    x-kubernetes-validations:
                    - message: credentialsSecretRef.name is required
                      rule: has(self.credentialsSecretRef.name) && size(self.credentialsSecretRef.name)
                        > 0
                    - message: controlPlaneEndpoint.host is required when apiServerLoadBalancer.enabled
                        is false
                      rule: 'has(self.apiServerLoadBalancer) && has(self.apiServerLoadBalancer.enabled)
                        && self.apiServerLoadBalancer.enabled ? true : has(self.controlPlaneEndpoint)
                        && has(self.controlPlaneEndpoint.host) && size(self.controlPlaneEndpoint.host)
                        > 0'
                    - message: bastion.imageID, bastion.machineType, bastion.sshKeyName,
                        and bastion.allowedCIDRs are required when bastion.enabled
                        is true
                      rule: '!has(self.bastion) || !has(self.bastion.enabled) || !self.bastion.enabled
                        || (has(self.bastion.imageID) && size(self.bastion.imageID)
                        > 0 && has(self.bastion.machineType) && size(self.bastion.machineType)
                        > 0 && has(self.bastion.sshKeyName) && size(self.bastion.sshKeyName)
                        > 0 && has(self.bastion.allowedCIDRs) && size(self.bastion.allowedCIDRs)
                        > 0)'
                required:
                - spec
                type: object
            required:
            - template
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
