apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    services:
      cidrBlocks:
        - 10.128.0.0/12
  topology:
    classRef:
      name: stackit
      namespace: ${CLUSTER_CLASS_NAMESPACE:-${NAMESPACE}}
    version: ${KUBERNETES_VERSION}
    controlPlane:
      replicas: ${CONTROL_PLANE_MACHINE_COUNT}
    workers:
      machineDeployments:
        - class: default-worker
          name: md-0
          replicas: ${WORKER_MACHINE_COUNT}
    variables:
      - name: stackitProjectID
        value: ${STACKIT_PROJECT_ID}
      - name: stackitRegion
        value: ${STACKIT_REGION}
      - name: stackitNetworkID
        value: ${STACKIT_NETWORK_ID}
      - name: stackitImageID
        value: ${STACKIT_IMAGE_ID}
      - name: stackitMachineType
        value: ${STACKIT_MACHINE_TYPE}
      - name: stackitSSHKeyName
        value: "${STACKIT_SSH_KEY_NAME}"
      - name: stackitCredentialsSecretName
        value: ${STACKIT_CREDENTIALS_SECRET_NAME}
