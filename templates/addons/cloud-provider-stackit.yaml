apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stackit-cloud-controller-manager
  namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stackit-cloud-config
  namespace: kube-system
data:
  cloud.yaml: |
    global:
      projectId: ${STACKIT_PROJECT_ID}
      region: ${STACKIT_REGION}
    loadBalancer:
      networkId: ${STACKIT_NETWORK_ID}
---
apiVersion: v1
kind: Secret
metadata:
  name: stackit-cloud-secret
  namespace: kube-system
type: Opaque
data:
  sa_key.json: ${STACKIT_SERVICE_ACCOUNT_JSON_B64}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stackit-cloud-controller-manager
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - "*"
  - apiGroups:
      - ""
    resources:
      - nodes/status
    verbs:
      - patch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - services/status
    verbs:
      - patch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stackit-cloud-controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stackit-cloud-controller-manager
subjects:
  - kind: ServiceAccount
    name: stackit-cloud-controller-manager
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackit-cloud-controller-manager
  namespace: kube-system
  labels:
    app: stackit-cloud-controller-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: stackit-cloud-controller-manager
  template:
    metadata:
      labels:
        app: stackit-cloud-controller-manager
    spec:
      serviceAccountName: stackit-cloud-controller-manager
      dnsPolicy: Default
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node.cloudprovider.kubernetes.io/uninitialized
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
        - key: node.kubernetes.io/unreachable
          operator: Exists
      containers:
        - name: stackit-cloud-controller-manager
          image: ${STACKIT_CLOUD_CONTROLLER_MANAGER_IMAGE}
          args:
            - --cloud-provider=stackit
            - --webhook-secure-port=0
            - --concurrent-service-syncs=3
            - --controllers=cloud-node-controller,cloud-node-lifecycle-controller,service-lb-controller
            - --authorization-always-allow-paths=/metrics
            - --leader-elect=true
            - --leader-elect-resource-name=stackit-cloud-controller-manager
            - --cloud-config=/etc/config/cloud.yaml
            - --cluster-name=${CLUSTER_NAME}
          env:
            - name: STACKIT_SERVICE_ACCOUNT_KEY_PATH
              value: /etc/serviceaccount/sa_key.json
          ports:
            - containerPort: 10258
              name: https
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
            - mountPath: /etc/config
              name: cloud-config
              readOnly: true
            - mountPath: /etc/serviceaccount
              name: cloud-secret
              readOnly: true
      volumes:
        - name: cloud-config
          configMap:
            name: stackit-cloud-config
        - name: cloud-secret
          secret:
            secretName: stackit-cloud-secret
